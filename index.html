
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Manage your money wisely!</p>
    </header>

    <main>
        <section class="dashboard">
            <h2>My Budget Dashboard</h2>

            <div class="summary">
                <div class="card">
                    <h3>Monthly Budget</h3>
                    <p id="budget">KSh 0</p>
                </div>

                <div class="card">
                    <h3>Total Expenses</h3>
                    <p id="totalExpenses">KSh 0</p>
                </div>

                <div class="card">
                    <h3>Remaining Balance</h3>
                    <p id="balance">KSh 0</p>
                </div>
            </div>
        </section>

        <section class="budget-section">
            <h2>Set Your Monthly Budget</h2>
            <form id="budgetForm">
                <input type="number" id="budgetInput"
                    placeholder="Enter budget in KSh" min="0" required>
                <button type="submit">Set Budget</button>
            </form>
        </section>

        <section class="expense-section">
            <h2>Add an Expense</h2>

            <form id="expenseForm">
                <input type="text" id="expenseName"
                    placeholder="Expense name" required>

                <input type="number" id="expenseAmount"
                    placeholder="Amount in KSh" min="0.01"
                    step="0.01" required>

                <select id="expenseCategory" required>
                    <option value="">Choose category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Education">Education</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="records-section">
            <h2>Expense Records</h2>

            <div id="message"></div>

            <table>
                <thead>
                    <tr>
                        <th>Expense</th>
                        <th>Category</th>
                        <th>Amount (KSh)</th>
                    </tr>
                </thead>

                <tbody id="expenseList">
                    <tr>
                        <td colspan="3">No expenses added yet.</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SpendWise Budget Tracker</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
